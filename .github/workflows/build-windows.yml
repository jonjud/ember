name: Windows Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build EMBER
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Run engine tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --verbose --output-on-failure --timeout 60
